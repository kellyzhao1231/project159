# FlowNP — PeakWeather (Swiss weather stations, irregular 2D spatial data)
# 128 stations, 4 features: temperature, pressure, humidity, wind_speed

data_path: /home/zross/proj/spl/datasets/peakweather_irregular.npz
dataset_name: peakweather

x_dim: 2
y_dim: 4

# Model architecture
dim_posenc: 80
d_model: 64
emb_depth: 4
dim_feedforward: 128
nhead: 4
dropout: 0.0
num_layers: 6
timesteps: 100

# Training
batch_size: 16
learning_rate: 5.0e-4
weight_decay: 0.0
epochs: 100

# Data splits
context_frac_range: [0.1, 0.5]
eval_context_frac: 0.3
num_workers: 4
eval_interval: 10
eval_num_samples: 20
