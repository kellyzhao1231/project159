# FlowNP — GP regression with RBF (squared-exponential) kernel

dataset_type: gp
kernel: rbf
dataset_name: gp_rbf

x_dim: 1
y_dim: 1

# GP data generation
epoch_size: 10000
eval_epoch_size: 1000
max_num_points: 50
x_range: [-2, 2]

# Model architecture
dim_posenc: 20
d_model: 64
emb_depth: 4
dim_feedforward: 128
nhead: 4
dropout: 0.0
num_layers: 6
timesteps: 100

# Training
batch_size: 16
learning_rate: 5.0e-4
weight_decay: 0.0
epochs: 100

# Data splits
context_frac_range: [0.1, 0.5]
eval_context_frac: 0.3
num_workers: 0
eval_interval: 10
eval_num_samples: 20
